<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="ucTitle ucDesc">
  <title id="ucTitle">Linux Live System Resource Monitor — use-case diagram</title>
  <desc id="ucDesc">A system administrator views CPU, memory, network, disk, and running-process data inside the monitor system.</desc>
  <rect width="880" height="480" fill="#FFFCF7"/>
