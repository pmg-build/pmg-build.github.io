  <text x="470" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1C1916">Linux Live System Resource Monitor</text>
  <line x1="248" y1="76" x2="692" y2="76" stroke="#D7D0C4" stroke-width="1"/>
